<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АВТОРУСЬ TANK</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="/" class="header__logo">
          <img
            src="/src/assets/images/logo.svg"
            alt="Авторусь Tank — на главную"
            width="54"
            height="70"
          />
        </a>
        <div class="header__content">
          <div class="header__top">
            <address class="header__address">
              <svg class="header__icon" aria-hidden="true" width="20" height="20">
                <use href="/sprite.svg#map-pin"></use>
              </svg>
              Ярославское шоссе, владение 2 В, строение 3 (МКАД, 95 км)
            </address>

            <div class="header__actions">
              <button class="header__action" type="button">
                <svg
                  class="header__icon header__icon--accent"
                  aria-hidden="true"
                  width="20"
                  height="20"
                >
                  <use href="/sprite.svg#settings"></use>
                </svg>
                Записаться на сервис
              </button>
              <button class="header__action" type="button">
                <svg
                  class="header__icon header__icon--accent"
                  aria-hidden="true"
                  width="20"
                  height="20"
                >
                  <use href="/sprite.svg#speedometer"></use>
                </svg>
                Тест-драйв
              </button>
            </div>
          </div>

          <div class="header__bottom">
            <p class="header__brand">АВТОРУСЬ TANK</p>
            <p class="header__tagline">Официальный дилер</p>

            <div class="header__contacts">
              <a href="tel:+79999999999" class="header__phone">+7 (999) 999-99-99</a>
              <p class="header__status">Мы на связи</p>
            </div>

            <button class="button button--primary button--small header__callback" type="button">
              <svg class="button__icon" aria-hidden="true" width="20" height="20">
                <use href="/sprite.svg#phone-incoming"></use>
              </svg>
              Заказать звонок
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <img
          class="hero__bg"
          src="/src/assets/images/hero.webp"
          alt=""
          width="1920"
          height="700"
          fetchpriority="high"
        />
        <div class="container hero__inner">
          <hgroup class="hero__heading">
            <p class="hero__eyebrow">Улучшим любые условия</p>
            <h1 class="hero__title">TANK 500</h1>
            <p class="hero__subtitle">Осталось всего 5 автомобилей!</p>
          </hgroup>
          <button class="button button--primary hero__button" type="button">
            Получить предложение
            <svg class="button__icon" aria-hidden="true" width="20" height="20">
              <use href="/sprite.svg#chevron"></use>
            </svg>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
